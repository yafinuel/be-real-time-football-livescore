services:
  postgres:
    image: postgres:17-alpine
    container_name: football-live-score-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: football-live-score-api
    working_dir: /app
    environment:
      - PORT=${PORT}
      - DATABASE_URL=${DATABASE_URL}
      - APP_ENV=${APP_ENV}
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      postgres:
        condition: service_healthy
    command: go run ./cmd/api

volumes:
  go-mod-cache:
  postgres-data: