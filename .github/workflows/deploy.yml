# Workflow: Build & Push Docker Image to GHCR (GitHub Container Registry)
#
# Hanya berjalan saat ada push/merge ke branch 'main' (tahap deployment)
# sesuai kebutuhan penghematan kuota GitHub Actions.

name: Build & Push to GHCR

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

# Batalkan run lama jika ada commit baru di branch main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & Push Container Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write # Wajib untuk push image ke ghcr.io

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ke GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ekstrak Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=v1.0.0
            type=raw,value=latest
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Build dan Push Docker Image (Multi-stage target: prod)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
