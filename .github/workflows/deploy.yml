# Workflow: Build & Push Docker Image to GHCR + GitHub Release
#
# Trigger:
#   - Push ke branch 'main'  → build & push image ke GHCR (tag: latest + sha)
#   - Push tag 'v*'          → build & push image ke GHCR (tag: versi + latest)
#                              + buat GitHub Release otomatis dengan aset siap pakai

name: Build, Push & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & Push Container Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ke GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ekstrak Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build dan Push Docker Image (Multi-stage target: prod)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-and-push

    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Buat GitHub Release & Upload Aset
        uses: softprops/action-gh-release@v2
        with:
          name: "🚀 Real-Time Football Live Score ${{ github.ref_name }}"
          generate_release_notes: true
          body: |
            ## 📦 Docker Image

            Image siap pakai tersedia di GitHub Container Registry (GHCR):

            ```
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```

            ## ⚡ Quickstart untuk Frontend Developer

            Tidak perlu install Go! Cukup download file `compose.fe.yaml` di bawah,
            lalu jalankan perintah berikut:

            ```bash
            docker compose -f compose.fe.yaml up -d
            ```

            Endpoint yang tersedia setelah server berjalan:
            | Endpoint | URL |
            |---|---|
            | GraphQL Playground | http://localhost:8080/ |
            | GraphQL / HTTP | http://localhost:8080/query |
            | WebSocket | ws://localhost:8080/query |

            ## ⚙️ Konfigurasi

            Salin `.env.example` ke `.env` dan sesuaikan nilainya jika diperlukan.
            Variabel `SIMULATOR_INTERVAL` dapat diubah untuk mengatur kecepatan simulasi pertandingan (default: `45s`).
          files: |
            compose.fe.yaml
            .env.example
